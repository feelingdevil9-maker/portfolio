<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音转写CER评测工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .filler-config {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .filler-tag {
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .filler-tag .remove-btn {
            cursor: pointer;
            color: #ff4444;
            font-weight: bold;
            font-size: 16px;
        }

        .filler-tag .remove-btn:hover {
            color: #cc0000;
        }

        .add-filler-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .add-filler-input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            flex: 1;
            max-width: 200px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: 'Microsoft YaHei', monospace;
            resize: vertical;
            line-height: 1.8;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .config-options {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }

        .results {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-top: 30px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .metric-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .metric-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .metric-value.highlight {
            color: #667eea;
        }

        .alignment-display {
            background: white;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 20px;
        }

        .alignment-row {
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            line-height: 2;
        }

        .alignment-label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        .char-cell {
            display: inline-block;
            padding: 5px 10px;
            margin: 2px;
            border-radius: 4px;
            min-width: 30px;
            text-align: center;
        }

        .char-correct {
            color: #333;
        }

        .char-substitute {
            background: #ffcccc;
            color: #cc0000;
            font-weight: bold;
        }

        .char-delete {
            background: #fff3cd;
            color: #856404;
            font-weight: bold;
        }

        .char-insert {
            background: #cce5ff;
            color: #004085;
            font-weight: bold;
        }

        .char-empty {
            background: #f0f0f0;
            color: #999;
        }
        
        .text-display {
            padding: 15px;
            background: #f9f9f9;
            border-radius: 5px;
            margin-bottom: 15px;
            line-height: 2;
            font-size: 16px;
        }
        
        .text-display-label {
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .error-summary {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .error-summary-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .error-list {
            font-size: 14px;
            line-height: 1.8;
            color: #555;
        }

        .error-item {
            margin-bottom: 5px;
        }

        .hidden {
            display: none;
        }

        .speaker-info {
            background: #e7f3ff;
            padding: 10px 15px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 13px;
            color: #004085;
        }

        @media (max-width: 768px) {
            .content {
                padding: 15px;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ 语音转写CER评测工具</h1>
            <p>准确评估语音识别模型的字错误率（CER）和忽略口水词CER</p>
        </div>

        <div class="content">
            <!-- 口水词配置 -->
            <div class="section">
                <div class="section-title">📝 口水词配置</div>
                <div class="filler-config" id="fillerTags"></div>
                <div class="add-filler-container">
                    <input type="text" 
                           class="add-filler-input" 
                           id="newFillerInput" 
                           placeholder="输入新口水词（如：嗯、那个）"
                           onkeypress="if(event.key==='Enter') addFiller()">
                    <button class="btn btn-primary" onclick="addFiller()">+ 添加口水词</button>
                    <button class="btn btn-secondary" onclick="resetFillers()">恢复默认</button>
                </div>
                <div class="speaker-info">
                    💡 提示：口水词将在计算"忽略口水词CER"时被移除
                </div>
            </div>

            <!-- 配置选项 -->
            <div class="section">
                <div class="section-title">⚙️ 配置选项</div>
                <div class="config-options">
                    <div class="checkbox-group">
                        <input type="checkbox" id="ignorePunctuation" checked>
                        <label for="ignorePunctuation">忽略标点符号</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="normalizeNumbers" checked>
                        <label for="normalizeNumbers">归一化数字（十五 = 15）</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="normalizeEnglish" checked>
                        <label for="normalizeEnglish">英文不区分大小写</label>
                    </div>
                </div>
                <div class="speaker-info">
                    💡 提示：行首的"我："、"TA："等说话人标记将自动识别并排除
                </div>
            </div>

            <!-- 文本输入 -->
            <div class="section">
                <div class="section-title">📄 输入文本</div>
                <div style="margin-bottom: 20px;">
                    <label class="input-label">原文（人工参考稿）：</label>
                    <textarea id="referenceText" placeholder="请输入人工标注的参考文本...&#10;支持多行，会自动识别说话人标记（如：我：、TA：、说话人1：）&#10;&#10;示例：&#10;我：嗯，今天天气不错&#10;TA：是的，那个，确实很好"></textarea>
                </div>
                <div>
                    <label class="input-label">转写内容（模型输出）：</label>
                    <textarea id="hypothesisText" placeholder="请输入模型转写的结果...&#10;&#10;示例：&#10;我：今天天气不错&#10;TA：是的，确实很好"></textarea>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="button-group">
                <button class="btn btn-primary" onclick="calculateCER()" style="font-size: 16px; padding: 12px 30px;">
                    🔍 计算CER
                </button>
                <button class="btn btn-secondary" onclick="resetAll()">
                    🔄 重置
                </button>
                <button class="btn btn-success" onclick="exportReport()" id="exportBtn" disabled>
                    📥 导出报告
                </button>
            </div>

            <!-- 结果展示 -->
            <div id="resultsContainer" class="hidden">
                <div class="results">
                    <div class="section-title">📊 评测结果</div>
                    
                    <!-- 指标卡片 -->
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <div class="metric-label">原文实际字数</div>
                            <div class="metric-value" id="totalCharsRef">0</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">原文有效字数（去口水词）</div>
                            <div class="metric-value" id="validCharsRef">0</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">实际错误字数</div>
                            <div class="metric-value" id="totalErrors">0</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">有效错误字数（去口水词）</div>
                            <div class="metric-value" id="validErrors">0</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">严格字准率</div>
                            <div class="metric-value highlight" id="strictAccuracy">0%</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">有效字准率</div>
                            <div class="metric-value highlight" id="validAccuracy">0%</div>
                        </div>
                    </div>

                    <!-- 对齐展示 -->
                    <div class="alignment-display">
                        <div class="section-title">🔤 原始文本对齐（包含口水词）</div>
                        <div id="originalAlignment"></div>
                        <div class="error-summary">
                            <div class="error-summary-title">错误详情：</div>
                            <div class="error-list" id="originalErrors"></div>
                        </div>
                    </div>

                    <div class="alignment-display">
                        <div class="section-title">✨ 净化文本对齐（忽略口水词）</div>
                        <div id="cleanAlignment"></div>
                        <div class="error-summary">
                            <div class="error-summary-title">错误详情：</div>
                            <div class="error-list" id="cleanErrors"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 默认口水词列表
        const DEFAULT_FILLERS = [
            '嗯', '啊', '呃', '哦', '唔', '嘛', '欸', '嘞', '嘿', '那个', '就是', '然后', '对对对'
        ];

        let fillerWords = [...DEFAULT_FILLERS];
        let lastResults = null;

        // 初始化
        window.onload = function() {
            renderFillerTags();
        };

        // 渲染口水词标签
        function renderFillerTags() {
            const container = document.getElementById('fillerTags');
            container.innerHTML = fillerWords.map(word => 
                `<div class="filler-tag">
                    ${word}
                    <span class="remove-btn" onclick="removeFiller('${word}')">×</span>
                </div>`
            ).join('');
        }

        // 添加口水词
        function addFiller() {
            const input = document.getElementById('newFillerInput');
            const word = input.value.trim();
            if (word && !fillerWords.includes(word)) {
                fillerWords.push(word);
                renderFillerTags();
                input.value = '';
            } else if (fillerWords.includes(word)) {
                alert('该口水词已存在！');
            }
        }

        // 移除口水词
        function removeFiller(word) {
            fillerWords = fillerWords.filter(w => w !== word);
            renderFillerTags();
        }

        // 恢复默认口水词
        function resetFillers() {
            fillerWords = [...DEFAULT_FILLERS];
            renderFillerTags();
        }

        // 移除说话人标记（只识别行首）
        function removeSpeakerLabels(text) {
            const lines = text.split('\n');
            return lines.map(line => {
                // 匹配行首的说话人标记：任意字符 + 中文冒号或英文冒号
                return line.replace(/^(.+?)[：:]\s*/, '');
            }).join('\n');
        }

        // 中文数字转阿拉伯数字
        function chineseToArabic(text) {
            const chineseNums = {
                '零': 0, '一': 1, '二': 2, '两': 2, '三': 3, '四': 4,
                '五': 5, '六': 6, '七': 7, '八': 8, '九': 9,
                '十': 10, '百': 100, '千': 1000, '万': 10000
            };

            // 处理特殊组合，如"十五"、"二十"、"一百二十三"等
            let result = text;
            
            // 十几的特殊处理
            result = result.replace(/十([一二三四五六七八九])/g, (match, p1) => {
                return String(10 + chineseNums[p1]);
            });
            
            // 单独的"十"
            result = result.replace(/([一二三四五六七八九])十/g, (match, p1) => {
                return String(chineseNums[p1] * 10);
            });

            // 两位数
            result = result.replace(/([一二三四五六七八九])十([一二三四五六七八九])/g, (match, p1, p2) => {
                return String(chineseNums[p1] * 10 + chineseNums[p2]);
            });

            // 单个数字替换
            Object.keys(chineseNums).forEach(key => {
                if (key !== '十' && key !== '百' && key !== '千' && key !== '万') {
                    result = result.split(key).join(String(chineseNums[key]));
                }
            });

            return result;
        }

        // 将处理后的字符串切分为 token 数组
        // 规则：中文字 → 单字token；英文连续字母 → 一个token；数字 → 每个数字字符一个token；其余字符 → 单字符token
        function tokenize(text) {
            const tokens = [];
            let i = 0;
            while (i < text.length) {
                const ch = text[i];
                // 英文字母序列作为一个 token
                if (/[a-zA-Z]/.test(ch)) {
                    let word = '';
                    while (i < text.length && /[a-zA-Z]/.test(text[i])) {
                        word += text[i];
                        i++;
                    }
                    tokens.push(word);
                } else {
                    // 中文字、数字字符、标点等都单独作为一个 token
                    tokens.push(ch);
                    i++;
                }
            }
            return tokens;
        }

        // 文本预处理：返回 token 数组
        function preprocessText(text, removeFillers = false) {
            let processed = text;

            // 1. 移除说话人标记
            processed = removeSpeakerLabels(processed);

            // 2. 归一化数字
            if (document.getElementById('normalizeNumbers').checked) {
                processed = chineseToArabic(processed);
            }

            // 3. 英文转小写
            if (document.getElementById('normalizeEnglish').checked) {
                processed = processed.toLowerCase();
            }

            // 4. 移除标点符号
            if (document.getElementById('ignorePunctuation').checked) {
                processed = processed.replace(/[，。！？、；：""''（）《》【】『』「」,\.!?;:"'()\[\]{}<>]/g, '');
            }

            // 5. 移除空格
            processed = processed.replace(/ /g, '');

            // 6. 移除口水词（如果需要）
            if (removeFillers) {
                const sortedFillers = [...fillerWords].sort((a, b) => b.length - a.length);
                sortedFillers.forEach(filler => {
                    processed = processed.split(filler).join('');
                });
            }

            // 7. 移除换行符
            processed = processed.replace(/\n/g, '');

            // 8. 切分为 token 数组
            return tokenize(processed);
        }

        // 计算编辑距离（Levenshtein距离）并返回操作序列，输入为 token 数组
        function levenshteinWithOperations(ref, hyp) {
            const m = ref.length;
            const n = hyp.length;
            
            // 初始化距离矩阵
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
            const ops = Array(m + 1).fill(null).map(() => Array(n + 1).fill(null));

            // 初始化第一行和第一列
            for (let i = 0; i <= m; i++) {
                dp[i][0] = i;
                ops[i][0] = i === 0 ? null : 'delete';
            }
            for (let j = 0; j <= n; j++) {
                dp[0][j] = j;
                ops[0][j] = j === 0 ? null : 'insert';
            }

            // 填充矩阵
            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (ref[i - 1] === hyp[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1];
                        ops[i][j] = 'match';
                    } else {
                        const substitute = dp[i - 1][j - 1] + 1;
                        const del = dp[i - 1][j] + 1;
                        const insert = dp[i][j - 1] + 1;
                        
                        const minVal = Math.min(substitute, del, insert);
                        dp[i][j] = minVal;
                        
                        if (minVal === substitute) {
                            ops[i][j] = 'substitute';
                        } else if (minVal === del) {
                            ops[i][j] = 'delete';
                        } else {
                            ops[i][j] = 'insert';
                        }
                    }
                }
            }

            // 回溯获取对齐序列
            const alignment = [];
            let i = m, j = n;
            
            while (i > 0 || j > 0) {
                const op = ops[i][j];
                
                if (op === 'match') {
                    alignment.unshift({
                        type: 'match',
                        ref: ref[i - 1],
                        hyp: hyp[j - 1],
                        refPos: i - 1,
                        hypPos: j - 1
                    });
                    i--; j--;
                } else if (op === 'substitute') {
                    alignment.unshift({
                        type: 'substitute',
                        ref: ref[i - 1],
                        hyp: hyp[j - 1],
                        refPos: i - 1,
                        hypPos: j - 1
                    });
                    i--; j--;
                } else if (op === 'delete') {
                    alignment.unshift({
                        type: 'delete',
                        ref: ref[i - 1],
                        hyp: '-',
                        refPos: i - 1,
                        hypPos: null
                    });
                    i--;
                } else if (op === 'insert') {
                    alignment.unshift({
                        type: 'insert',
                        ref: '-',
                        hyp: hyp[j - 1],
                        refPos: null,
                        hypPos: j - 1
                    });
                    j--;
                }
            }

            // 统计错误
            let substitutions = 0, deletions = 0, insertions = 0;
            alignment.forEach(item => {
                if (item.type === 'substitute') substitutions++;
                else if (item.type === 'delete') deletions++;
                else if (item.type === 'insert') insertions++;
            });

            return {
                distance: dp[m][n],
                alignment: alignment,
                substitutions: substitutions,
                deletions: deletions,
                insertions: insertions
            };
        }

        // 渲染对齐结果（整体展示，保持原始排版）
        function renderAlignment(alignment, ref, hyp, originalRefText, originalHypText, removeFillers) {
            const errors = [];
            
            // 创建原始文本到处理后 token 的位置映射
            function createPositionMap(originalText, removeFillers) {
                const lines = originalText.split('\n');
                const posMap = []; // 每个 token 对应的原始文本信息
                
                lines.forEach((line, lineIdx) => {
                    // 移除说话人标记
                    const speakerMatch = line.match(/^(.+?)[：:]\s*/);
                    const speaker = speakerMatch ? speakerMatch[0] : '';
                    const lineWithoutSpeaker = line.replace(/^(.+?)[：:]\s*/, '');
                    let processedLine = lineWithoutSpeaker;
                    
                    // 应用所有预处理
                    if (document.getElementById('normalizeNumbers').checked) {
                        processedLine = chineseToArabic(processedLine);
                    }
                    if (document.getElementById('normalizeEnglish').checked) {
                        processedLine = processedLine.toLowerCase();
                    }
                    if (document.getElementById('ignorePunctuation').checked) {
                        processedLine = processedLine.replace(/[，。！？、；：""''（）《》【】『』「」,\.!?;:"'()\[\]{}<>]/g, '');
                    }
                    processedLine = processedLine.replace(/ /g, '');
                    
                    // 如果需要移除口水词
                    if (removeFillers) {
                        const sortedFillers = [...fillerWords].sort((a, b) => b.length - a.length);
                        sortedFillers.forEach(filler => {
                            processedLine = processedLine.split(filler).join('');
                        });
                    }
                    
                    // 切分为 token 数组，每个 token 记录行信息
                    const lineTokens = tokenize(processedLine);
                    lineTokens.forEach((token, tokenIdx) => {
                        posMap.push({
                            lineIdx: lineIdx,
                            char: token,
                            speaker: speaker,
                            isNewLine: tokenIdx === 0
                        });
                    });
                });
                
                return posMap;
            }
            
            // 创建位置映射
            const refPosMap = createPositionMap(originalRefText, removeFillers);
            const hypPosMap = createPositionMap(originalHypText, removeFillers);
            
            // 构建原文显示
            const refDisplay = [];
            let lastRefLine = -1;
            
            alignment.forEach((item, idx) => {
                if (item.refPos !== null && refPosMap[item.refPos]) {
                    const posInfo = refPosMap[item.refPos];
                    
                    // 如果是新行，添加换行和说话人标记
                    if (posInfo.lineIdx !== lastRefLine) {
                        if (lastRefLine !== -1) {
                            refDisplay.push('<br>');
                        }
                        if (posInfo.speaker) {
                            refDisplay.push(posInfo.speaker);
                        }
                        lastRefLine = posInfo.lineIdx;
                    }
                    
                    // 添加字符
                    if (item.type === 'match') {
                        refDisplay.push(item.ref);
                    } else if (item.type === 'substitute') {
                        refDisplay.push(`<span class="char-substitute">${item.ref}</span>`);
                        errors.push(`"${item.ref}" 被替换为 "${item.hyp}"`);
                    } else if (item.type === 'delete') {
                        refDisplay.push(`<span class="char-delete">${item.ref}</span>`);
                        errors.push(`"${item.ref}" 被删除（漏识别）`);
                    }
                }
            });
            
            // 构建转写显示
            const hypDisplay = [];
            let lastHypLine = -1;
            let currentHypLine = -1;
            
            alignment.forEach((item, idx) => {
                // 确定当前应该在哪一行
                if (item.hypPos !== null && hypPosMap[item.hypPos]) {
                    currentHypLine = hypPosMap[item.hypPos].lineIdx;
                } else if (item.refPos !== null && refPosMap[item.refPos]) {
                    // 对于删除的情况，使用原文的行号
                    currentHypLine = refPosMap[item.refPos].lineIdx;
                }
                
                // 处理换行和说话人标记
                if (currentHypLine !== lastHypLine && currentHypLine !== -1) {
                    if (lastHypLine !== -1) {
                        hypDisplay.push('<br>');
                    }
                    // 获取说话人标记（优先从转写中获取，如果没有则从原文获取）
                    let speaker = '';
                    if (item.hypPos !== null && hypPosMap[item.hypPos]) {
                        speaker = hypPosMap[item.hypPos].speaker;
                    } else if (item.refPos !== null && refPosMap[item.refPos]) {
                        speaker = refPosMap[item.refPos].speaker;
                    }
                    if (speaker) {
                        hypDisplay.push(speaker);
                    }
                    lastHypLine = currentHypLine;
                }
                
                // 添加字符或占位符
                if (item.type === 'match') {
                    hypDisplay.push(item.hyp);
                } else if (item.type === 'substitute') {
                    hypDisplay.push(`<span class="char-substitute">${item.hyp}</span>`);
                } else if (item.type === 'delete') {
                    // 在转写中显示被删除（漏识别）的字符，用黄色背景标注
                    hypDisplay.push(`<span class="char-delete">${item.ref}</span>`);
                } else if (item.type === 'insert') {
                    hypDisplay.push(`<span class="char-insert">${item.hyp}</span>`);
                    errors.push(`"${item.hyp}" 被插入（多识别）`);
                }
            });
            
            // 生成HTML
            const html = `
                <div style="margin-bottom: 20px;">
                    <div class="text-display-label">原文：</div>
                    <div class="text-display">${refDisplay.join('') || '<span style="color: #999;">（空）</span>'}</div>
                </div>
                <div>
                    <div class="text-display-label">转写：</div>
                    <div class="text-display">${hypDisplay.join('') || '<span style="color: #999;">（空）</span>'}</div>
                </div>
            `;

            return { html, errors };
        }

        // 计算CER
        function calculateCER() {
            const refText = document.getElementById('referenceText').value;
            const hypText = document.getElementById('hypothesisText').value;

            if (!refText.trim() || !hypText.trim()) {
                alert('请输入原文和转写内容！');
                return;
            }

            // 原始文本处理（不移除口水词）
            const refOriginal = preprocessText(refText, false);
            const hypOriginal = preprocessText(hypText, false);

            // 净化文本处理（移除口水词）
            const refClean = preprocessText(refText, true);
            const hypClean = preprocessText(hypText, true);

            // 计算原始CER
            const originalResult = levenshteinWithOperations(refOriginal, hypOriginal);
            const originalCER = refOriginal.length > 0 
                ? (originalResult.distance / refOriginal.length * 100).toFixed(2)
                : 0;

            // 计算忽略口水词CER
            const cleanResult = levenshteinWithOperations(refClean, hypClean);
            const cleanCER = refClean.length > 0
                ? (cleanResult.distance / refClean.length * 100).toFixed(2)
                : 0;

            // 渲染原始对齐
            const originalAlignmentRender = renderAlignment(originalResult.alignment, refOriginal, hypOriginal, refText, hypText, false);
            document.getElementById('originalAlignment').innerHTML = originalAlignmentRender.html;
            document.getElementById('originalErrors').innerHTML = 
                originalAlignmentRender.errors.length > 0 
                    ? originalAlignmentRender.errors.map(e => `<div class="error-item">• ${e}</div>`).join('')
                    : '<div class="error-item">✅ 无错误</div>';

            // 渲染净化对齐
            const cleanAlignmentRender = renderAlignment(cleanResult.alignment, refClean, hypClean, refText, hypText, true);
            document.getElementById('cleanAlignment').innerHTML = cleanAlignmentRender.html;
            document.getElementById('cleanErrors').innerHTML = 
                cleanAlignmentRender.errors.length > 0 
                    ? cleanAlignmentRender.errors.map(e => `<div class="error-item">• ${e}</div>`).join('')
                    : '<div class="error-item">✅ 无错误</div>';

            // 计算字准率
            const strictAccuracy = (100 - parseFloat(originalCER)).toFixed(2);
            const validAccuracy = (100 - parseFloat(cleanCER)).toFixed(2);

            // 更新指标
            document.getElementById('totalCharsRef').textContent = refOriginal.length;
            document.getElementById('validCharsRef').textContent = refClean.length;
            document.getElementById('totalErrors').textContent = originalResult.distance;
            document.getElementById('validErrors').textContent = cleanResult.distance;
            document.getElementById('strictAccuracy').textContent = strictAccuracy + '%';
            document.getElementById('validAccuracy').textContent = validAccuracy + '%';

            // 显示结果
            document.getElementById('resultsContainer').classList.remove('hidden');
            document.getElementById('exportBtn').disabled = false;

            // 保存结果供导出使用
            lastResults = {
                refOriginal, hypOriginal, refClean, hypClean,
                originalResult, cleanResult, originalCER, cleanCER,
                originalErrors: originalAlignmentRender.errors,
                cleanErrors: cleanAlignmentRender.errors
            };

            // 滚动到结果区域
            document.getElementById('resultsContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 重置所有内容
        function resetAll() {
            document.getElementById('referenceText').value = '';
            document.getElementById('hypothesisText').value = '';
            document.getElementById('resultsContainer').classList.add('hidden');
            document.getElementById('exportBtn').disabled = true;
            lastResults = null;
        }

        // 导出报告
        function exportReport() {
            if (!lastResults) {
                alert('请先计算CER！');
                return;
            }

            const timestamp = new Date().toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            }).replace(/\//g, '-');

            let report = `语音转写CER评测报告
生成时间：${timestamp}
${'='.repeat(60)}

【配置信息】
忽略标点符号：${document.getElementById('ignorePunctuation').checked ? '是' : '否'}
归一化数字：${document.getElementById('normalizeNumbers').checked ? '是' : '否'}
英文不区分大小写：${document.getElementById('normalizeEnglish').checked ? '是' : '否'}
口水词列表：${fillerWords.join('、')}

${'='.repeat(60)}

【评测结果】
原文实际字数：${lastResults.refOriginal.length}
原文有效字数（去口水词）：${lastResults.refClean.length}
实际错误字数：${lastResults.originalResult.distance}
有效错误字数（去口水词）：${lastResults.cleanResult.distance}

严格字准率：${(100 - parseFloat(lastResults.originalCER)).toFixed(2)}%
有效字准率：${(100 - parseFloat(lastResults.cleanCER)).toFixed(2)}%

${'='.repeat(60)}

【原始文本对齐】（包含口水词）

原文：${lastResults.refOriginal.join('')}
转写：${lastResults.hypOriginal.join('')}

错误统计：
- 替换（S）：${lastResults.originalResult.substitutions} 处
- 删除（D）：${lastResults.originalResult.deletions} 处
- 插入（I）：${lastResults.originalResult.insertions} 处

错误详情：
${lastResults.originalErrors.length > 0 ? lastResults.originalErrors.map(e => `  • ${e}`).join('\n') : '  ✅ 无错误'}

${'='.repeat(60)}

【净化文本对齐】（忽略口水词）

原文：${lastResults.refClean.join('')}
转写：${lastResults.hypClean.join('')}

错误统计：
- 替换（S'）：${lastResults.cleanResult.substitutions} 处
- 删除（D'）：${lastResults.cleanResult.deletions} 处
- 插入（I'）：${lastResults.cleanResult.insertions} 处

错误详情：
${lastResults.cleanErrors.length > 0 ? lastResults.cleanErrors.map(e => `  • ${e}`).join('\n') : '  ✅ 无错误'}

${'='.repeat(60)}

【原始输入】

原文（人工参考稿）：
${document.getElementById('referenceText').value}

转写内容（模型输出）：
${document.getElementById('hypothesisText').value}

${'='.repeat(60)}
报告结束`;

            // 创建下载
            const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `CER评测报告_${new Date().getTime()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
